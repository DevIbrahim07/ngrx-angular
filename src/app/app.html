<main class="min-h-screen grid place-items-center overflow-hidden px-4 py-10">
  <div
    class="absolute inset-0 -z-10 bg-[radial-gradient(circle_at_20%_15%,rgba(16,185,129,0.2),transparent_35%),radial-gradient(circle_at_80%_85%,rgba(14,165,233,0.2),transparent_35%),linear-gradient(135deg,#f8fafc,#ecfeff_45%,#eef2ff)]"
  ></div>

  <section
    class="counter-card w-full max-w-md rounded-3xl border border-white/70 bg-white/70 p-6 shadow-2xl backdrop-blur-xl sm:p-8"
  >
    <p class="tracking-[0.2em] text-xs font-semibold uppercase text-slate-500">State Management</p>
    <h1 class="mt-2 text-3xl font-black text-slate-900 sm:text-4xl">NgRx Counter App</h1>

    <div class="mt-8 flex justify-center">
      <div
        class="counter-ring relative grid h-36 w-36 place-items-center rounded-full border border-slate-200/60 bg-white/80 shadow-lg sm:h-40 sm:w-40"
      >
        <span class="sr-only">Current Counter Value</span>
        <span class="value-pop text-5xl font-black tabular-nums text-slate-900 sm:text-6xl">{{
          counter$ | async
        }}</span>
      </div>
    </div>

    <div class="mt-8 grid grid-cols-3 gap-3">
      <button
        type="button"
        (click)="inc()"
        class="btn-action rounded-2xl bg-emerald-500 px-4 py-3 text-xl font-bold text-white shadow-lg shadow-emerald-500/30 transition hover:bg-emerald-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/50"
      >
        +
      </button>

      <button
        type="button"
        (click)="dec()"
        class="btn-action rounded-2xl bg-sky-500 px-4 py-3 text-xl font-bold text-white shadow-lg shadow-sky-500/30 transition hover:bg-sky-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-500/50"
      >
        -
      </button>

      <button
        type="button"
        (click)="resetCount()"
        class="btn-action rounded-2xl bg-slate-900 px-4 py-3 text-sm font-bold uppercase tracking-wide text-white shadow-lg shadow-slate-900/30 transition hover:bg-slate-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-700/50"
      >
        Reset
      </button>
    </div>
  </section>
</main>
